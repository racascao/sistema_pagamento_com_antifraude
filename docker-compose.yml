name: payment-processor

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  fraud:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: fraud
    environment:
      GRPC_ADDR: ":9002"
      GEO_PROVIDER: static
    ports:
      - "9002:9002"

  ledger:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: ledger
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payments?sslmode=disable
      GRPC_ADDR: ":9001"
      FRAUD_GRPC_ADDR: fraud:9002
      KAFKA_BROKER: redpanda:9092
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      fraud:
        condition: service_started

  investigator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: investigator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payments?sslmode=disable
      LEDGER_GRPC_ADDR: ledger:9001
      KAFKA_BROKER: redpanda:9092
      GEO_PROVIDER: static
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      ledger:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      LEDGER_GRPC_ADDR: ledger:9001
      KAFKA_BROKER: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      ledger:
        condition: service_started
      redpanda:
        condition: service_healthy

  console:
    image: huncoding/payment-processor-console:latest
    ports:
      - "3001:80"
    depends_on:
      gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/monitoring/prometheus/compose.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
