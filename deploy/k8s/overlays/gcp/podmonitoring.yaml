# PodMonitoring resources tell the GKE-managed Prometheus collector
# (enabled at the cluster level in deploy/terraform/gke.tf via
# monitoring_config.managed_prometheus) which pods to scrape. Without
# these, Managed Prometheus never sees the /metrics endpoints, even
# though the Services in metrics-services.yaml exist.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: gateway
  namespace: payment-processor
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: 8080
      path: /metrics
      interval: 15s
