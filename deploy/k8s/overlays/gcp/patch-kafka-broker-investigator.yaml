apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
  namespace: payment-processor
spec:
  template:
    spec:
      containers:
        - name: investigator
          env:
            - name: KAFKA_BROKER
              value: null
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: broker
            - name: KAFKA_SASL_MECHANISM
              value: OAUTHBEARER
