# Dedicated Services for the metrics listeners of the gRPC services.
# The gateway exposes /metrics on its main HTTP port already.
apiVersion: v1
kind: Service
metadata:
  name: ledger-metrics
  namespace: payment-processor
spec:
  selector:
    app: ledger
  ports:
    - port: 9101
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-metrics
  namespace: payment-processor
spec:
  selector:
    app: fraud
  ports:
    - port: 9102
---
apiVersion: v1
kind: Service
metadata:
  name: investigator-metrics
  namespace: payment-processor
spec:
  selector:
    app: investigator
  ports:
    - port: 9103
